<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e2a47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ATC Admin">
<title>ATC Transport · Fleet Tracking Admin</title>
<link rel="manifest" href="manifest-admin.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="center-wrap">
  <form id="loginForm" class="login-card">
    <div style="text-align:center"><img src="icons/atc-logo.png" alt="ATC - All India Transport Company" width="170" height="161" style="max-width:60%;height:auto"></div>
    <div class="muted small" style="text-align:center;letter-spacing:.12em;margin-top:4px">MUNNA &amp; ASIF · ADMIN LOGIN</div>
    <label>Username
      <input type="text" id="un" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="jaise: munna" required>
    </label>
    <label style="margin-top:0">Password
      <input type="password" id="pw" autocomplete="current-password" required>
    </label>
    <button class="btn primary block" type="submit" id="loginBtn">Login</button>
    <p id="loginMsg" class="msg err"></p>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="appView" hidden>
  <header class="topbar">
    <span class="brand" style="display:flex;align-items:center;gap:8px"><img src="icons/icon-192.png" alt="" width="30" height="30" style="border-radius:6px;background:#fff"> ATC Transport · Tracking</span>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="live">Live map</button>
      <button class="tab-btn" data-tab="trips">Trips</button>
      <button class="tab-btn" data-tab="new">New trip</button>
      <button class="tab-btn" data-tab="history">Route history</button>
    </nav>
    <div class="right">
      <span id="whoami" style="font-weight:700;color:#fff"></span><span id="updatedAt">—</span>
      <button class="btn sm" id="btnRefresh">Refresh</button>
      <button class="btn sm" id="btnLogout">Logout</button>
    </div>
  </header>

  <main>
    <!-- LIVE -->
    <section id="tab-live">
      <div class="live-grid">
        <div class="panel live-list" id="liveList"></div>
        <div class="map-box">
          <div id="liveMap"></div>
          <div class="map-tools"><button class="btn sm" id="btnFit">Sabhi gaadiyan dikhayein</button></div>
        </div>
      </div>
    </section>

    <!-- TRIPS -->
    <section id="tab-trips" hidden>
      <div class="toolbar">
        <input type="search" id="q" placeholder="Vehicle / driver / party / trip ID">
        <select id="statusFilter">
          <option value="active">Active (Loading + In Transit)</option>
          <option value="all">Sabhi trips</option>
          <option value="Loading">Loading</option>
          <option value="In Transit">In Transit</option>
          <option value="Delivered">Delivered</option>
        </select>
        <span class="muted small" id="tripCount"></span>
      </div>
      <div class="panel table-wrap">
        <table>
          <thead><tr>
            <th>Trip</th><th>Vehicle / Driver</th><th>Party</th><th>Route</th>
            <th>Status</th><th>Tracking</th><th>Actions</th>
          </tr></thead>
          <tbody id="tripRows"></tbody>
        </table>
      </div>
    </section>

    <!-- NEW TRIP -->
    <section id="tab-new" hidden>
      <form id="tripForm" class="panel" autocomplete="off">
        <div class="form-grid">
          <label>Vehicle number *<input name="vehicleNo" placeholder="MH31 AB 1234" required></label>
          <label>Driver name *<input name="driverName" required></label>
          <label>Driver mobile * (WhatsApp)<input name="driverMobile" inputmode="tel" placeholder="98XXXXXXXX" required></label>
          <label>Party name *<input name="partyName" required></label>
          <label>Party mobile<input name="partyMobile" inputmode="tel"></label>
          <label>Loading location *<input name="loadingLocation" required></label>
          <label>Delivery location *<input name="deliveryLocation" required></label>
          <label>Material<input name="material"></label>
          <label>Freight (₹)<input name="freight" inputmode="decimal"></label>
          <label class="full">Remarks (driver ko bhi dikhega)<textarea name="remarks"></textarea></label>
        </div>
        <div class="form-actions">
          <button class="btn primary" type="submit" id="createBtn">Trip create karein</button>
          <button class="btn ghost" type="reset">Clear</button>
        </div>
        <p id="formMsg" class="msg err" style="padding:0 16px"></p>
        <div id="createdBox" class="result-card" hidden>
          <b>Trip ban gayi ✓</b>
          <div class="small muted" id="createdInfo"></div>
          <code id="createdLink"></code>
          <div class="toolbar" style="margin:0">
            <button class="btn green" type="button" id="createdWA">WhatsApp par driver ko bhejein</button>
            <button class="btn" type="button" id="createdCopy">Link copy karein</button>
          </div>
        </div>
      </form>
    </section>

    <!-- HISTORY -->
    <section id="tab-history" hidden>
      <div class="toolbar">
        <select id="histSelect" style="min-width:260px"></select>
        <button class="btn" id="histLoad">Route dikhayein</button>
        <button class="btn" id="histCsv" disabled>CSV download</button>
      </div>
      <div class="stats" id="histStats"></div>
      <div class="hist-grid">
        <div class="map-box"><div id="histMap"></div></div>
        <div class="panel hist-list table-wrap">
          <table>
            <thead><tr><th>Time</th><th>Accuracy</th><th>km/h</th></tr></thead>
            <tbody id="histRows"><tr><td colspan="3" class="muted">Trip select karke "Route dikhayein" dabayein.</td></tr></tbody>
          </table>
        </div>
      </div>
      <p class="muted small" id="histNote"></p>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js?v=3"></script>
<script src="common.js?v=3"></script>
<script>
(function () {
  const U = window.TAB, cfg = U.cfg, esc = U.esc;
  const $ = function (id) { return document.getElementById(id); };
  const STALE_MS = (Number(cfg.STALE_AFTER_MIN) || 5) * 60000;
  const TILE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const TILE_ATTR = '&copy; OpenStreetMap contributors';

  let session = sessionStorage.getItem('tab_session') || '';
  let adminUser = sessionStorage.getItem('tab_user') || '';
  let trips = [];
  let liveMap = null, histMap = null, histLayer = null;
  let liveMarkers = {}, firstFit = true, refreshTimer = null, currentTab = 'live';
  let histPoints = [], histTrip = null, lastCreated = null;

  /* ---------------- utils ---------------- */
  function toast(msg, isErr) {
    const t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  }

  async function call(action, payload) {
    const data = await U.api(action, Object.assign({ session: session }, payload || {}));
    if (data && data.error === 'UNAUTHORIZED') {
      logout();
      throw new Error('Session expire ho gaya. Dobara login karein.');
    }
    return data;
  }

  function trackUrl(token) {
    const base = cfg.TRACK_PAGE_URL || new URL('track.html', location.href).href;
    return base + '?t=' + encodeURIComponent(token);
  }

  function waMessage(t) {
    return 'Namaste ' + t.driverName + ' ji,\n\n' +
      'ATC Transport (All India Transport Company) ki taraf se aapki gaadi ' + t.vehicleNo +
      ' ki *trip ki details dekhne ke liye* neeche diye link ko open karein:\n\n' +
      trackUrl(t.token) + '\n\n' +
      'Link kholkar Location *"Allow"* karein, tabhi trip ki details dikhengi.\n' +
      '(Yeh link sirf aapke liye hai, kisi aur ko forward na karein.)\n\n' +
      '- ATC Transport (Munna & Asif)';
  }

  function sendWA(t) {
    window.open('https://wa.me/' + t.driverMobile + '?text=' + encodeURIComponent(waMessage(t)), '_blank', 'noopener');
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast('Link copy ho gaya'); }
    catch (e) { window.prompt('Link copy karein:', text); }
  }

  function freshness(t) {
    if (t.lastLat == null || !t.lastTime) return 'off';
    return (Date.now() - t.lastTime) <= STALE_MS ? 'fresh' : 'stale';
  }

  function ctrlButtons(t) {
    if (t.status === 'Delivered') return '';
    const stopped = t.trackingState === 'Stopped';
    return (stopped
      ? '<button class="btn sm green" data-act="resume">Tracking chalu</button>'
      : '<button class="btn sm" data-act="stop">Tracking band</button>') +
      '<button class="btn sm danger" data-act="complete">Trip complete</button>';
  }

  async function doControl(t, act) {
    try {
      let r;
      if (act === 'complete') {
        if (!confirm(t.vehicleNo + ' ki trip complete (Delivered) karni hai? Driver ki tracking band ho jayegi.')) return;
        r = await call('setStatus', { tripId: t.tripId, status: 'Delivered' });
      } else if (act === 'resetdev') {
        if (!confirm(t.vehicleNo + ': link ka device lock hatana hai? Driver ab naye phone par link khol sakega.')) return;
        r = await call('resetDevice', { tripId: t.tripId });
      } else if (act === 'stop') {
        if (!confirm(t.vehicleNo + ' ki tracking band karni hai? Driver ka page/app location bhejna rok dega.')) return;
        r = await call('setTracking', { tripId: t.tripId, enabled: false });
      } else {
        r = await call('setTracking', { tripId: t.tripId, enabled: true });
      }
      if (!r.ok) throw new Error(r.message || 'Action nahi hua.');
      toast(act === 'resetdev' ? 'Device lock hata diya' : act === 'complete' ? 'Trip complete ho gayi' : act === 'stop' ? 'Tracking band ki gayi' : 'Tracking chalu ki gayi');
      loadTrips(true);
    } catch (err) { toast(err.message, true); }
  }

  function statusBadge(s) {
    const cls = s === 'Delivered' ? 'b-delivered' : s === 'In Transit' ? 'b-transit' : 'b-loading';
    return '<span class="badge ' + cls + '">' + esc(s) + '</span>';
  }

  function liveBadge(t) {
    if (t.status !== 'Delivered' && t.trackingState === 'Stopped') return '<span class="badge b-off">Tracking band (admin)</span>';
    const f = freshness(t);
    if (f === 'fresh') return '<span class="badge b-live">Live</span>';
    if (f === 'stale') return '<span class="badge b-stale">Purani location</span>';
    return '<span class="badge b-off">Location nahi aayi</span>';
  }

  /* ---------------- login / logout ---------------- */
  $('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('loginMsg').textContent = '';
    $('loginBtn').disabled = true;
    try {
      const r = await U.api('login', { username: $('un').value.trim(), password: $('pw').value });
      if (r && r.ok) {
        session = r.session; adminUser = r.user || '';
        sessionStorage.setItem('tab_session', session); sessionStorage.setItem('tab_user', adminUser);
        $('pw').value = '';
        enterApp();
      } else {
        $('loginMsg').textContent = (r && r.message) || 'Login nahi ho paya.';
      }
    } catch (err) {
      $('loginMsg').textContent = err.message || 'Server se connect nahi ho paya.';
    }
    $('loginBtn').disabled = false;
  });

  function logout() {
    session = '';
    sessionStorage.removeItem('tab_session'); sessionStorage.removeItem('tab_user'); adminUser = '';
    clearInterval(refreshTimer);
    $('appView').hidden = true;
    $('loginView').hidden = false;
  }
  $('btnLogout').addEventListener('click', logout);

  function enterApp() {
    $('whoami').textContent = adminUser ? '👤 ' + adminUser : '';
    $('loginView').hidden = true;
    $('appView').hidden = false;
    initLiveMap();
    showTab('live');
    loadTrips();
    clearInterval(refreshTimer);
    refreshTimer = setInterval(function () {
      if (!document.hidden && session) loadTrips(true);
    }, Math.max(5, Number(cfg.ADMIN_REFRESH_SEC) || 15) * 1000);
  }

  /* ---------------- tabs ---------------- */
  function showTab(name) {
    currentTab = name;
    ['live', 'trips', 'new', 'history'].forEach(function (n) {
      $('tab-' + n).hidden = (n !== name);
    });
    document.querySelectorAll('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.tab === name);
    });
    if (name === 'live' && liveMap) setTimeout(function () { liveMap.invalidateSize(); }, 50);
    if (name === 'history') { initHistMap(); fillHistSelect(); setTimeout(function () { histMap.invalidateSize(); }, 50); }
  }
  document.querySelectorAll('.tab-btn').forEach(function (b) {
    b.addEventListener('click', function () { showTab(b.dataset.tab); });
  });

  /* ---------------- load trips ---------------- */
  async function loadTrips(silent) {
    try {
      const r = await call('listTrips');
      if (!r || !r.ok) throw new Error('Trips load nahi hui.');
      trips = r.trips;
      renderAll();
      $('updatedAt').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
    } catch (e) {
      if (!silent) toast(e.message, true);
      $('updatedAt').textContent = 'Update fail';
    }
  }
  $('btnRefresh').addEventListener('click', function () { loadTrips(); });

  function renderAll() {
    renderLive();
    renderTrips();
    if (currentTab === 'history') fillHistSelect();
  }

  /* ---------------- live map ---------------- */
  function initLiveMap() {
    if (liveMap) return;
    liveMap = L.map('liveMap').setView([21.1458, 79.0882], 6); // Nagpur (India ka centre)
    L.tileLayer(TILE, { maxZoom: 19, attribution: TILE_ATTR }).addTo(liveMap);
  }

  function pinIcon(t) {
    return L.divIcon({
      className: 'veh-pin ' + freshness(t),
      html: '<div class="dot"></div><div class="lbl">' + esc(t.vehicleNo) + '</div>',
      iconSize: [16, 16], iconAnchor: [8, 8]
    });
  }

  function popupHtml(t) {
    return '<b>' + esc(t.vehicleNo) + '</b> · ' + esc(t.driverName) + '<br>' +
      esc(t.loadingLocation) + ' → ' + esc(t.deliveryLocation) + '<br>' +
      'Status: ' + esc(t.status) + '<br>' +
      'Last update: ' + esc(U.timeAgo(t.lastTime)) + '<br>' +
      'Accuracy: ' + (t.lastAcc != null ? '±' + esc(t.lastAcc) + ' m' : '—');
  }

  function renderLive() {
    const active = trips.filter(function (t) { return t.status !== 'Delivered'; });
    const seen = {};
    const bounds = [];

    active.forEach(function (t) {
      if (t.lastLat == null) return;
      seen[t.tripId] = true;
      const ll = [t.lastLat, t.lastLng];
      bounds.push(ll);
      let m = liveMarkers[t.tripId];
      if (!m) {
        m = { marker: L.marker(ll, { icon: pinIcon(t) }).addTo(liveMap), circle: null };
        m.marker.bindPopup(popupHtml(t));
        liveMarkers[t.tripId] = m;
      } else {
        m.marker.setLatLng(ll);
        m.marker.setIcon(pinIcon(t));
        m.marker.setPopupContent(popupHtml(t));
      }
      if (m.circle) { liveMap.removeLayer(m.circle); m.circle = null; }
      if (t.lastAcc != null && t.lastAcc <= 2000) {
        m.circle = L.circle(ll, {
          radius: t.lastAcc, weight: 1, color: '#1f6feb', fillOpacity: 0.08, interactive: false
        }).addTo(liveMap);
      }
    });

    Object.keys(liveMarkers).forEach(function (id) {
      if (!seen[id]) {
        liveMap.removeLayer(liveMarkers[id].marker);
        if (liveMarkers[id].circle) liveMap.removeLayer(liveMarkers[id].circle);
        delete liveMarkers[id];
      }
    });

    if (firstFit && bounds.length) { fitAll(); firstFit = false; }

    const list = $('liveList');
    if (!active.length) {
      list.innerHTML = '<div class="live-item muted">Abhi koi active trip nahi hai. "New trip" se trip banayein.</div>';
      return;
    }
    list.innerHTML = active.map(function (t) {
      return '<div class="live-item ' + freshness(t) + '" data-trip="' + esc(t.tripId) + '">' +
        '<div class="row1"><b>' + esc(t.vehicleNo) + '</b>' + liveBadge(t) + '</div>' +
        '<div class="small">' + esc(t.driverName) + ' · ' + esc(t.partyName) + '</div>' +
        '<div class="small muted">' + esc(t.loadingLocation) + ' → ' + esc(t.deliveryLocation) + '</div>' +
        '<div class="small">' + statusBadge(t.status) + ' &nbsp;' + esc(U.timeAgo(t.lastTime)) +
        (t.lastAcc != null ? ' · ±' + esc(t.lastAcc) + ' m' : '') + '</div>' +
        '<div class="actions" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">' + ctrlButtons(t) + '</div></div>';
    }).join('');
  }

  function fitAll() {
    const pts = Object.keys(liveMarkers).map(function (id) { return liveMarkers[id].marker.getLatLng(); });
    if (!pts.length) { toast('Abhi kisi gaadi ki location nahi aayi.'); return; }
    if (pts.length === 1) liveMap.setView(pts[0], 14);
    else liveMap.fitBounds(L.latLngBounds(pts), { padding: [40, 40] });
  }
  $('btnFit').addEventListener('click', fitAll);

  $('liveList').addEventListener('click', function (e) {
    const el = e.target.closest('.live-item[data-trip]');
    if (!el) return;
    const cb = e.target.closest('button[data-act]');
    if (cb) {
      const tt = trips.find(function (x) { return x.tripId === el.dataset.trip; });
      if (tt) doControl(tt, cb.dataset.act);
      return;
    }
    const m = liveMarkers[el.dataset.trip];
    if (!m) { toast('Is gaadi ki location abhi nahi aayi.'); return; }
    liveMap.setView(m.marker.getLatLng(), Math.max(liveMap.getZoom(), 14));
    m.marker.openPopup();
  });

  /* ---------------- trips table ---------------- */
  function filteredTrips() {
    const q = $('q').value.trim().toLowerCase();
    const f = $('statusFilter').value;
    return trips.filter(function (t) {
      if (f === 'active' && t.status === 'Delivered') return false;
      if (f !== 'active' && f !== 'all' && t.status !== f) return false;
      if (!q) return true;
      return [t.tripId, t.vehicleNo, t.driverName, t.partyName, t.loadingLocation, t.deliveryLocation]
        .join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderTrips() {
    const rows = filteredTrips();
    $('tripCount').textContent = rows.length + ' trips';
    if (!rows.length) {
      $('tripRows').innerHTML = '<tr><td colspan="7" class="muted">Koi trip nahi mili.</td></tr>';
      return;
    }
    $('tripRows').innerHTML = rows.map(function (t) {
      const opts = ['Loading', 'In Transit', 'Delivered'].map(function (s) {
        return '<option' + (s === t.status ? ' selected' : '') + '>' + s + '</option>';
      }).join('');
      return '<tr data-trip="' + esc(t.tripId) + '">' +
        '<td><b>' + esc(t.tripId) + '</b><div class="small muted">' + esc(U.fmtDT(t.createdAt)) + '</div>' +
        (t.createdBy ? '<div class="small muted">by ' + esc(t.createdBy) + '</div>' : '') + '</td>' +
        '<td><b>' + esc(t.vehicleNo) + '</b><div>' + esc(t.driverName) + '</div><div class="small muted">' + esc(t.driverMobile) + '</div></td>' +
        '<td>' + esc(t.partyName) + '<div class="small muted">' + esc(t.material || '') + '</div></td>' +
        '<td>' + esc(t.loadingLocation) + '<br>→ ' + esc(t.deliveryLocation) + '</td>' +
        '<td><select data-act="status">' + opts + '</select></td>' +
        '<td>' + liveBadge(t) + '<div class="small muted">' + esc(t.trackingState || '') + (t.deviceBound ? ' · 📱 1 phone' : '') + ' · ' + esc(U.timeAgo(t.lastTime)) +
        (t.lastAcc != null ? ' · ±' + esc(t.lastAcc) + ' m' : '') + '</div></td>' +
        '<td><div class="actions">' +
        ctrlButtons(t) +
        '<button class="btn sm green" data-act="wa">WhatsApp</button>' +
        '<button class="btn sm" data-act="copy">Link</button>' +
        '<button class="btn sm" data-act="map">Map</button>' +
        '<button class="btn sm" data-act="hist">Route</button>' +
        (t.deviceBound ? '<button class="btn sm" data-act="resetdev" title="Link ek phone se bandha hai. Naya phone allow karne ke liye dabayein">Device reset</button>' : '') +
        '<button class="btn sm" data-act="regen" title="Purana link band karke naya banayein">Naya link</button>' +
        '</div></td></tr>';
    }).join('');
  }
  $('q').addEventListener('input', renderTrips);
  $('statusFilter').addEventListener('change', renderTrips);

  $('tripRows').addEventListener('click', async function (e) {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const tr = btn.closest('tr');
    const t = trips.find(function (x) { return x.tripId === tr.dataset.trip; });
    if (!t) return;
    const act = btn.dataset.act;
    if (act === 'stop' || act === 'resume' || act === 'complete' || act === 'resetdev') doControl(t, act);
    else if (act === 'wa') sendWA(t);
    else if (act === 'copy') copyText(trackUrl(t.token));
    else if (act === 'map') {
      showTab('live');
      const m = liveMarkers[t.tripId];
      if (m) { liveMap.setView(m.marker.getLatLng(), 15); m.marker.openPopup(); }
      else toast('Is gaadi ki location abhi nahi aayi.');
    } else if (act === 'hist') {
      showTab('history');
      $('histSelect').value = t.tripId;
      loadHistory();
    } else if (act === 'regen') {
      if (!confirm('Purana link turant band ho jayega. Naya link driver ko dobara bhejna padega. Aage badhein?')) return;
      try {
        const r = await call('regenerateToken', { tripId: t.tripId });
        if (!r.ok) throw new Error('Naya link nahi ban paya.');
        toast('Naya link ban gaya. Ab WhatsApp se bhejein.');
        await loadTrips(true);
        const nt = trips.find(function (x) { return x.tripId === t.tripId; });
        if (nt) sendWA(nt);
      } catch (err) { toast(err.message, true); }
    }
  });

  $('tripRows').addEventListener('change', async function (e) {
    const sel = e.target.closest('select[data-act="status"]');
    if (!sel) return;
    const id = sel.closest('tr').dataset.trip;
    try {
      const r = await call('setStatus', { tripId: id, status: sel.value });
      if (!r.ok) throw new Error(r.message || 'Status update nahi hua.');
      toast('Status: ' + sel.value);
      loadTrips(true);
    } catch (err) { toast(err.message, true); loadTrips(true); }
  });

  /* ---------------- create trip ---------------- */
  $('tripForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('formMsg').textContent = '';
    $('createdBox').hidden = true;
    const fd = new FormData(e.target);
    const trip = {};
    fd.forEach(function (v, k) { trip[k] = v; });
    $('createBtn').disabled = true;
    try {
      const r = await call('createTrip', { trip: trip });
      if (!r.ok) throw new Error(r.message || 'Trip create nahi hui.');
      lastCreated = r.trip;
      $('createdInfo').textContent = r.trip.tripId + ' · ' + r.trip.vehicleNo + ' · ' + r.trip.driverName;
      $('createdLink').textContent = trackUrl(r.trip.token);
      $('createdBox').hidden = false;
      e.target.reset();
      loadTrips(true);
    } catch (err) {
      $('formMsg').textContent = err.message;
    }
    $('createBtn').disabled = false;
  });
  $('createdWA').addEventListener('click', function () { if (lastCreated) sendWA(lastCreated); });
  $('createdCopy').addEventListener('click', function () { if (lastCreated) copyText(trackUrl(lastCreated.token)); });

  /* ---------------- history ---------------- */
  function initHistMap() {
    if (histMap) return;
    histMap = L.map('histMap').setView([21.1458, 79.0882], 6);
    L.tileLayer(TILE, { maxZoom: 19, attribution: TILE_ATTR }).addTo(histMap);
  }

  function fillHistSelect() {
    const sel = $('histSelect');
    const keep = sel.value;
    sel.innerHTML = trips.map(function (t) {
      return '<option value="' + esc(t.tripId) + '">' + esc(t.vehicleNo) + ' · ' + esc(t.driverName) +
        ' · ' + esc(t.tripId) + ' (' + esc(t.status) + ')</option>';
    }).join('');
    if (keep) sel.value = keep;
  }

  async function loadHistory() {
    const id = $('histSelect').value;
    if (!id) return;
    $('histLoad').disabled = true;
    try {
      const r = await call('getHistory', { tripId: id });
      if (!r.ok) throw new Error('History load nahi hui.');
      histPoints = r.points;
      histTrip = r.trip;
      drawHistory(r);
    } catch (err) { toast(err.message, true); }
    $('histLoad').disabled = false;
  }
  $('histLoad').addEventListener('click', loadHistory);

  function drawHistory(r) {
    const pts = r.points;
    if (histLayer) { histMap.removeLayer(histLayer); histLayer = null; }
    $('histCsv').disabled = !pts.length;

    if (!pts.length) {
      $('histStats').innerHTML = '';
      $('histRows').innerHTML = '<tr><td colspan="3" class="muted">Is trip ki abhi koi location record nahi hui.</td></tr>';
      $('histNote').textContent = '';
      return;
    }

    const latlngs = pts.map(function (p) { return [p[1], p[2]]; });
    histLayer = L.layerGroup().addTo(histMap);
    L.polyline(latlngs, { color: '#1f6feb', weight: 4, opacity: 0.85 }).addTo(histLayer);
    L.circleMarker(latlngs[0], { radius: 8, color: '#fff', weight: 2, fillColor: '#13a35a', fillOpacity: 1 })
      .bindTooltip('Start · ' + U.fmtDT(pts[0][0])).addTo(histLayer);
    L.circleMarker(latlngs[latlngs.length - 1], { radius: 8, color: '#fff', weight: 2, fillColor: '#c8342b', fillOpacity: 1 })
      .bindTooltip('Latest · ' + U.fmtDT(pts[pts.length - 1][0])).addTo(histLayer);
    histMap.fitBounds(L.latLngBounds(latlngs), { padding: [30, 30] });

    // stats (gap analysis background-tracking ko test karne ke kaam aata hai)
    let dist = 0, maxGap = 0, gaps = 0, accSum = 0, accN = 0;
    const gapLimit = Math.max(2 * 60000, 3 * (Number(cfg.PING_INTERVAL_SEC) || 30) * 1000);
    for (let i = 0; i < pts.length; i++) {
      if (pts[i][3] != null) { accSum += pts[i][3]; accN++; }
      if (i === 0) continue;
      const d = U.distKm(pts[i - 1][1], pts[i - 1][2], pts[i][1], pts[i][2]);
      if (d * 1000 > 15) dist += d; // GPS jitter ignore
      const g = pts[i][0] - pts[i - 1][0];
      if (g > maxGap) maxGap = g;
      if (g > gapLimit) gaps++;
    }
    const dur = pts[pts.length - 1][0] - pts[0][0];
    const stats = [
      ['Points', r.total + (r.downsampled ? ' (dikha rahe: ' + pts.length + ')' : '')],
      ['Distance (approx)', dist.toFixed(1) + ' km'],
      ['Duration', U.fmtDur(dur)],
      ['Avg accuracy', accN ? '±' + Math.round(accSum / accN) + ' m' : '—'],
      ['Sabse bada gap', U.fmtDur(maxGap)],
      ['Gaps > ' + U.fmtDur(gapLimit), String(gaps)]
    ];
    $('histStats').innerHTML = stats.map(function (s) {
      return '<div class="panel stat"><div class="v">' + esc(s[1]) + '</div><div class="k">' + esc(s[0]) + '</div></div>';
    }).join('');

    $('histRows').innerHTML = pts.slice().reverse().slice(0, 300).map(function (p) {
      return '<tr><td>' + esc(U.fmtDT(p[0])) + '</td><td>' + (p[3] != null ? '±' + esc(p[3]) + ' m' : '—') +
        '</td><td>' + (p[4] != null ? esc(p[4]) : '—') + '</td></tr>';
    }).join('');
    $('histNote').textContent = (r.downsampled
      ? 'Zyada points hone se map/stats approx hain (har n-th point). ' : '') +
      'Table mein latest 300 points dikh rahe hain; poora data CSV mein milega.';
  }

  $('histCsv').addEventListener('click', function () {
    if (!histPoints.length || !histTrip) return;
    const lines = ['time_iso,lat,lng,accuracy_m,speed_kmh'];
    histPoints.forEach(function (p) {
      lines.push([new Date(p[0]).toISOString(), p[1], p[2], p[3] == null ? '' : p[3], p[4] == null ? '' : p[4]].join(','));
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = histTrip.tripId + '_route.csv';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  /* ---------------- PWA ---------------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  /* ---------------- boot ---------------- */
  if (session) enterApp();
})();
</script>
</body>
</html>
